
[tool.poetry]
name = "nzovu"
version = "0.0.1.dev0"
description = "Python SDK for interacting with the Nzovu service"
authors = ["Adrien <n.adrien@mun.ca>"]
license = "MIT"
readme = "README.md"
packages = [{include = "nzovu"}]
include = [{path = "proto", format = "sdist"}, {path = "scripts", format = "sdist"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords = ["nzovu", "grpc", "sdk"]

[tool.poetry.dependencies]
python = "^3.10"
grpcio = "^1.76.0"
protobuf = "^5.29.5"
pydantic = {version = "^2.0", optional = true}

[tool.poetry.extras]
pydantic = ["pydantic"]

[tool.poetry.group.dev.dependencies]
grpcio-tools = "1.71.2"
mypy-protobuf = "3.7.0"
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
uvicorn = "^0.38.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"
pydantic = "^2.0"


[tool.poetry.urls]
Source = "https://github.com/adrien19/nzovu-sdk-python"
Tracker = "https://github.com/adrien19/nzovu-sdk-python/issues"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core==2.3.0"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | nzovu/api
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["nzovu/api/**"]
known_first_party = ["nzovu"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
exclude = [
    "nzovu/api/v1/",
    "nzovu/api/common/",
    "nzovu/api/google/",
    "nzovu/api/message/",
    "nzovu/api/queue/",
    "nzovu/api/queueservice/",
    "nzovu/api/schedule/",
    "nzovu/api/schema/",
]

# Ignore all errors from generated protobuf code
[[tool.mypy.overrides]]
module = [
    "nzovu.api.common.*",
    "nzovu.api.google.*",
    "nzovu.api.message.*",
    "nzovu.api.queue.*",
    "nzovu.api.queueservice.*",
    "nzovu.api.schedule.*",
    "nzovu.api.schema.*",
]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as an asyncio test",
]

[tool.coverage.run]
source = ["nzovu"]
omit = [
    "*/tests/*",
    "*/nzovu/api/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]