name: Create Version Bump PR

on:
  push:
    tags:
      - "*-release"
      - "*-beta"

jobs:
  details:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package_information.outputs.package_name }}
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      is_release: ${{ steps.release.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract tag and details
        id: release
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            NEW_VERSION=$(echo $TAG_NAME | awk -F'-' '{print $1}')
            SUFFIX=$(echo $TAG_NAME | awk -F'-' '{print $2}')
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "Version is $NEW_VERSION"
            echo "Suffix is $SUFFIX"
            echo "Tag name is $TAG_NAME"
            
            # Determine if this is a production release
            if [ "$SUFFIX" = "release" ]; then
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              echo "This is a production release"
            else
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              echo "This is a beta/test release"
            fi
          else
            echo "No tag found"
            exit 1
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Get package name
        id: package_information
        run: |
          package_information=$(poetry version)
          PACKAGE_NAME=$(echo $package_information | awk '{print $1}')
          echo "Package name: $PACKAGE_NAME"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

  check_testpypi:
    needs: details
    runs-on: ubuntu-latest
    steps:
      - name: Fetch information from TestPyPI
        run: |
          PACKAGE_NAME=${{ needs.details.outputs.package_name }}
          response=$(curl -s https://test.pypi.org/pypi/$PACKAGE_NAME/json || echo "{}")
          latest_previous_version=$(echo "$response" | python3 -c "import sys, json; from packaging import version; data = json.load(sys.stdin); versions = [v for v in data.get('releases', {}).keys() if not version.parse(v).is_prerelease]; print(max(versions, key=version.parse, default='0.0.0') if versions else '0.0.0')" || echo "0.0.0")
          echo "Latest version on TestPyPI: $latest_previous_version"
          echo "latest_previous_version=$latest_previous_version" >> $GITHUB_ENV
      
      - name: Compare versions and exit if not newer
        run: |
          NEW_VERSION=${{ needs.details.outputs.new_version }}
          LATEST_VERSION=$latest_previous_version
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$NEW_VERSION" | sort -rV | head -n 1)" != "$NEW_VERSION" ] || [ "$NEW_VERSION" == "$LATEST_VERSION" ]; then
            echo "The new version $NEW_VERSION is not greater than the latest version $LATEST_VERSION on TestPyPI."
            exit 1
          else
            echo "The new version $NEW_VERSION is greater than the latest version $LATEST_VERSION on TestPyPI."
          fi

  check_pypi:
    needs: details
    if: needs.details.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch information from PyPI
        run: |
          PACKAGE_NAME=${{ needs.details.outputs.package_name }}
          response=$(curl -s https://pypi.org/pypi/$PACKAGE_NAME/json || echo "{}")
          latest_previous_version=$(echo "$response" | python3 -c "import sys, json; from packaging import version; data = json.load(sys.stdin); versions = [v for v in data.get('releases', {}).keys() if not version.parse(v).is_prerelease]; print(max(versions, key=version.parse, default='0.0.0') if versions else '0.0.0')" || echo "0.0.0")
          echo "Latest version on PyPI: $latest_previous_version"
          echo "latest_previous_version=$latest_previous_version" >> $GITHUB_ENV
      
      - name: Compare versions and exit if not newer
        run: |
          NEW_VERSION=${{ needs.details.outputs.new_version }}
          LATEST_VERSION=$latest_previous_version
          if [ "$(printf '%s\n' "$LATEST_VERSION" "$NEW_VERSION" | sort -rV | head -n 1)" != "$NEW_VERSION" ] || [ "$NEW_VERSION" == "$LATEST_VERSION" ]; then
            echo "The new version $NEW_VERSION is not greater than the latest version $LATEST_VERSION on PyPI."
            exit 1
          else
            echo "The new version $NEW_VERSION is greater than the latest version $LATEST_VERSION on PyPI."
          fi

  create_version_bump_pr:
    needs: [details, check_testpypi, check_pypi]
    if: |
      always() &&
      !cancelled() &&
      needs.check_testpypi.result == 'success' &&
      (needs.details.outputs.is_release != 'true' || needs.check_pypi.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Set project version with Poetry
        run: |
          CURRENT_VERSION=$(poetry version -s)
          echo "Current version: $CURRENT_VERSION"
          NEW_VERSION=${{ needs.details.outputs.new_version }}
          echo "Target version: $NEW_VERSION"
          poetry version $NEW_VERSION
      
      - name: Check if version changed
        id: version_check
        run: |
          # Check if the version line in pyproject.toml actually changed
          if git diff pyproject.toml | grep -q '^[+-]version = '; then
            echo "Version changed in pyproject.toml"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged in pyproject.toml, skipping commit and PR"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: No version change notification
        if: steps.version_check.outputs.version_changed == 'false'
        run: |
          CURRENT_VERSION=$(poetry version -s)
          echo "::notice title=No Version Bump Required::Version ${{ needs.details.outputs.new_version }} already exists in pyproject.toml (current version: $CURRENT_VERSION). No pull request will be created."
          echo ""
          echo "=============================================="
          echo "   NO PULL REQUEST CREATED"
          echo "=============================================="
          echo ""
          echo "The version in pyproject.toml is already set to $CURRENT_VERSION"
          echo "Tag requested: ${{ needs.details.outputs.tag_name }}"
          echo "Version requested: ${{ needs.details.outputs.new_version }}"
          echo ""
          echo "Possible reasons:"
          echo "  1. The version bump PR was already created and merged"
          echo "  2. The tag was pushed after the version was manually updated"
          echo "  3. This workflow was re-run for an existing tag"
          echo ""
          echo "No action needed - workflow completed successfully."
          echo "=============================================="
      
      - name: Create Pull Request
        if: steps.version_check.outputs.version_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: develop
          branch: version-bump-${{ needs.details.outputs.new_version }}
          title: "Bump version to ${{ needs.details.outputs.new_version }} for ${{ needs.details.outputs.suffix }}"
          body: |
            ## Version Bump for Release
            
            This PR bumps the package version to **${{ needs.details.outputs.new_version }}** for the **${{ needs.details.outputs.tag_name }}** tag.
            
            **Release Type:** ${{ needs.details.outputs.suffix }}
            **Package:** ${{ needs.details.outputs.package_name }}
            
            ### What happens after merge?
            
            Once this PR is merged, the `Build and Publish` workflow will automatically:
            1. Build the package with version ${{ needs.details.outputs.new_version }}
            2. Publish to TestPyPI
            ${{ needs.details.outputs.is_release == 'true' && fromJSON('"3. Publish to PyPI (production release)\\n4. Create a GitHub Release"') || '' }}
            
            ### Review Checklist
            - [ ] Version number is correct
            - [ ] CHANGELOG has been updated (if applicable)
            - [ ] All tests are passing
          labels: ${{ needs.details.outputs.is_release == 'true' && 'version-bump,automated,production-release' || 'version-bump,automated' }}
          commit-message: "Bump version to ${{ needs.details.outputs.new_version }}"
          add-paths: pyproject.toml
