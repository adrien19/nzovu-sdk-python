name: CI

on:
  push:
    branches: [main, 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POETRY_KEYRING_ENABLED: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: snok/install-poetry@v1
        with:
          version: 2.3.1
          virtualenvs-in-project: true
      - run: make install-dev
      - name: Install locked example
        working-directory: examples/store-api
        run: poetry sync --with dev
      - run: make check-proto
      - run: make format FORMAT_FLAGS=--check
      - run: make lint typecheck test-examples test-coverage
      - run: make build check-identity
      - name: Audit SDK and example dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install pip-audit==2.10.1
          make audit PIP_AUDIT="$RUNNER_TEMP/audit/bin/pip-audit"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  installed-linux:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nzovu
          POSTGRES_PASSWORD: sdk-fixture
          POSTGRES_DB: nzovu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nzovu -d nzovu"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: sdk-distributions
          path: dist
      - name: Read pinned server revision
        id: server
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + json.load(open('proto/SOURCE.json'))['commit'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: adrien19/nzovu
          ref: ${{ steps.server.outputs.commit }}
          path: .live-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: .live-server/go.mod
          cache-dependency-path: .live-server/go.sum
      - name: Build pinned server
        working-directory: .live-server
        run: CGO_ENABLED=1 go build -tags sqlite -o "$RUNNER_TEMP/nzovu" .
      - name: Installed SDK matrix with both backends
        env:
          NZOVU_TEST_POSTGRES_DSN: postgres://nzovu:sdk-fixture@localhost:5432/nzovu?sslmode=disable
          NZOVU_REQUIRE_BACKENDS: sqlite,postgres
        run: |
          python scripts/run_live_ownership.py --server-binary "$RUNNER_TEMP/nzovu" --temp-root "$RUNNER_TEMP" -- \
            python scripts/check_artifacts.py --profiles minimum latest \
              --run-tests --report reports/installed-linux-${{ matrix.python }}.json
      - uses: snok/install-poetry@v1
        if: matrix.python == '3.12'
        with:
          version: 2.3.1
          virtualenvs-in-project: true
      - name: Live store example with installed wheel
        if: matrix.python == '3.12'
        working-directory: examples/store-api
        env:
          NZOVU_TEST_POSTGRES_DSN: postgres://nzovu:sdk-fixture@localhost:5432/nzovu?sslmode=disable
          NZOVU_REQUIRE_BACKENDS: sqlite,postgres
        run: |
          poetry sync --with dev
          poetry run python -m pip install --no-deps --force-reinstall ../../dist/*.whl
          python ../../scripts/run_live_ownership.py --server-binary "$RUNNER_TEMP/nzovu" --temp-root "$RUNNER_TEMP" -- \
            poetry run python -m pytest tests/test_live_store.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-linux-${{ matrix.python }}
          path: |
            reports/
            ${{ runner.temp }}/nzovu-sdk-live-*/*.log

  installed-desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sdk-distributions
          path: dist
      - name: Installed unit and transport matrix
        run: python scripts/check_artifacts.py --profiles minimum latest --run-tests --report reports/installed-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-${{ runner.os }}
          path: reports/
