services:
  nzovu:
    image: ${NZOVU_IMAGE:?Build the pinned server and set NZOVU_IMAGE}
    command: [server, --dev, --storage-type, postgres, --postgres-host, postgres, --postgres-sslmode, disable]
    environment:
      POSTGRES_USER: nzovu
      POSTGRES_PASSWORD: local-example
      POSTGRES_DB: nzovu
      NZOVU_TLS_ENABLED: "false"
      AUTH_ENABLED: "true"
      API_KEYS: local-example-key
      METRICS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nzovu
      POSTGRES_PASSWORD: local-example
      POSTGRES_DB: nzovu
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nzovu -d nzovu]
      interval: 2s
      timeout: 2s
      retries: 20
