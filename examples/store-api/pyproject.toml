[tool.poetry]
name = "store-api"
version = "0.1.0"
description = "Example store API application using Nzovu Python SDK"
authors = ["Nzovu Team"]
readme = "README.md"
packages = [{include = "api"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.115,<1"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pydantic = "^2.12.5"
nzovu = {path = "../..", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.2.0"
httpx = ">=0.28,<1"

[build-system]
requires = ["poetry-core==2.3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
